<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 자리 현황 - SMART CLASS</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/src/shared/page.css" />
    <style>
        .content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .intro { color: var(--text-muted); font-size: 0.9rem; text-align: center; }

        .legend {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.on { background-color: var(--success-solid); }
        .dot.off { background-color: var(--border-strong); }

        .desk {
            padding: 10px;
            text-align: center;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Same 4x2 layout as the timetable page */
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        /* Default: not seated */
        .seat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 10px;
            color: var(--text-muted);
            text-align: center;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 92px;
        }

        /* Pressure detected: seated */
        .seat-card.occupied {
            background: var(--success-soft);
            border-color: var(--success-border);
            color: var(--success-text);
        }
        .seat-card.empty { background: var(--surface-2); border-style: dashed; color: var(--text-faint); }

        .seat-num { font-size: 0.75rem; color: var(--text-faint); margin-bottom: 4px; }
        .student-name { font-size: 1.05rem; font-weight: 700; }
        .seat-card.occupied .student-name { color: var(--success-text); }
        .sensor-val { font-size: 0.7rem; color: var(--text-faint); margin-top: 6px; }

        .test-panel { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }

        @media (max-width: 640px) {
            .seat-grid { gap: 8px; }
            .seat-card { padding: 12px 4px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="/" class="nav-btn" title="메인으로">←</a>
            <div class="title">실시간 자리 현황</div>
            <a href="/" class="nav-btn" title="홈으로">🏠</a>
        </div>

        <div class="content">
            <p class="intro">시간표 페이지에서 저장한 자리 배치를 기반으로 착석 감지 상태를 표시합니다.</p>
            <div class="legend">
                <div class="legend-item"><span class="dot on"></span> 착석 (압력 감지)</div>
                <div class="legend-item"><span class="dot off"></span> 부재 (미감지)</div>
            </div>

            <div class="desk box">교탁</div>
            <div class="seat-grid" id="seatGrid"></div>

            <!-- Simulation until Raspberry Pi server is connected -->
            <div class="test-panel sim-box">
                <div class="sim-box-title">🧪 센서 미연결용 시뮬레이션</div>
                <button class="btn primary small" id="randomToggleBtn">무작위 감지 상태 변경</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/pages/seats.js"></script>
</body>
</html>
