<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 자리 현황 - SMART CLASS</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/src/shared/page.css" />
    <style>
        .content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .intro { color: #64748b; font-size: 0.9rem; text-align: center; }

        .legend {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.on { background-color: #22c55e; }
        .dot.off { background-color: #94a3b8; }

        .desk {
            padding: 11px;
            text-align: center;
            background: #e5e8ed;
            border-radius: 9px;
            font-weight: 700;
        }

        /* Same 4x2 layout as the timetable page */
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        /* Default: grey (not seated) */
        .seat-card {
            background-color: #94a3b8;
            border-radius: 12px;
            padding: 16px 10px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 90px;
        }

        /* Pressure detected: green (seated) */
        .seat-card.occupied {
            background-color: #22c55e;
            box-shadow: 0 6px 12px -2px rgba(34, 197, 94, 0.4);
            transform: translateY(-2px);
        }
        .seat-card.empty { background-color: #e2e8f0; color: #94a3b8; box-shadow: none; }

        .seat-num { font-size: 0.75rem; opacity: 0.85; margin-bottom: 4px; }
        .student-name { font-size: 1.1rem; font-weight: bold; }
        .sensor-val { font-size: 0.7rem; opacity: 0.75; margin-top: 6px; }

        /* Simulation panel */
        .test-panel {
            background: #e0f2fe;
            border: 1px dashed #0284c7;
            padding: 15px 20px;
            border-radius: 14px;
            text-align: center;
        }
        .test-panel h3 { font-size: 0.9rem; margin-bottom: 10px; color: #0369a1; }
        .test-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .test-btn:hover { background: #0369a1; }

        @media (max-width: 640px) {
            .seat-grid { gap: 8px; }
            .seat-card { padding: 12px 4px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="/" class="nav-btn" title="메인으로">←</a>
            <div class="title">실시간 자리 현황</div>
            <a href="/" class="nav-btn" title="홈으로">🏠</a>
        </div>

        <div class="content">
            <p class="intro">시간표 페이지에서 저장한 자리 배치를 기반으로 착석 감지 상태를 표시합니다.</p>
            <div class="legend">
                <div class="legend-item"><span class="dot on"></span> 착석 (압력 감지)</div>
                <div class="legend-item"><span class="dot off"></span> 부재 (미감지)</div>
            </div>

            <div class="desk">교탁</div>
            <div class="seat-grid" id="seatGrid"></div>

            <!-- Simulation until Raspberry Pi server is connected -->
            <div class="test-panel">
                <h3>🧪 센서 미연결용 시뮬레이션</h3>
                <button class="test-btn" id="randomToggleBtn">무작위 감지 상태 변경</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/pages/seats.js"></script>
</body>
</html>
